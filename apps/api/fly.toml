# Fly.io deployment. Postgres lives on Neon's free tier rather than a Fly
# volume, so this app holds no state and can scale to zero between sessions.
#
# One-time setup:
#   fly launch --no-deploy --name leetlearn-api
#   fly secrets set LEETLEARN_DATABASE_URL="postgresql+psycopg://...neon.tech/leetlearn?sslmode=require"
#   fly secrets set LEETLEARN_JWT_SECRET="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
#   fly secrets set LEETLEARN_GITHUB_CLIENT_ID=... LEETLEARN_GITHUB_CLIENT_SECRET=...
#   fly deploy

app = "leetlearn-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Never enable the dev bypass here — it accepts any user id as identity.
  LEETLEARN_DEV_AUTH_ENABLED = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero minimum keeps the free allowance intact; the first request after an
  # idle period pays a short wake-up latency.
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
